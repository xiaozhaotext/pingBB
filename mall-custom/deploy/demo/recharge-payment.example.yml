# Merge into deployment configuration. Keep private keys outside the repository.
mall:
  recharge:
    payment:
      enabled: false
      wechat:
        enabled: false
        app-id: ${RECHARGE_WECHAT_APP_ID:}
        merchant-id: ${RECHARGE_WECHAT_MERCHANT_ID:}
        merchant-serial-number: ${RECHARGE_WECHAT_MERCHANT_SERIAL:}
        private-key-path: ${RECHARGE_WECHAT_PRIVATE_KEY_PATH:}
        api-v3-key: ${RECHARGE_WECHAT_API_V3_KEY:}
        notify-url: ${RECHARGE_WECHAT_NOTIFY_URL:}
      alipay:
        enabled: false
        app-id: ${RECHARGE_ALIPAY_APP_ID:}
        seller-id: ${RECHARGE_ALIPAY_SELLER_ID:}
        private-key-path: ${RECHARGE_ALIPAY_PRIVATE_KEY_PATH:}
        public-key-path: ${RECHARGE_ALIPAY_PUBLIC_KEY_PATH:}
        gateway-url: ${RECHARGE_ALIPAY_GATEWAY_URL:}
        notify-url: ${RECHARGE_ALIPAY_NOTIFY_URL:}
        return-url: ${RECHARGE_ALIPAY_RETURN_URL:}
