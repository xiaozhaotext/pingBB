# Demo only. Enable HTTPS before using login over a public network.
# Install as an nginx site after replacing the server_name and verifying paths.
server {
    listen 80;
    server_name _;
    root /opt/mall-demo/storefront;
    index index.html;
    client_max_body_size 10m;

    location = /admin { return 301 /admin/; }
    location /admin/ {
        alias /opt/mall-demo/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    location = /portal/mockPayment/confirm { return 404; }
    location ^~ /portal/alipay/ { return 404; }
    location ^~ /portal/swagger-ui/ { return 404; }
    location ^~ /portal/v3/api-docs { return 404; }
    location ^~ /portal/druid/ { return 404; }
    location ^~ /portal/actuator/ { return 404; }
    location /portal/ {
        proxy_pass http://127.0.0.1:8085/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /admin-api/admin/register { return 404; }
    location ^~ /admin-api/swagger-ui/ { return 404; }
    location ^~ /admin-api/v3/api-docs { return 404; }
    location ^~ /admin-api/druid/ { return 404; }
    location ^~ /admin-api/actuator/ { return 404; }
    location /admin-api/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / { try_files $uri $uri/ /index.html; }
}
