# Demo HTTPS 终止配置。登录只在 HTTPS 下使用。
# 安装为 nginx site 前，请替换 server_name 与证书路径，并核对静态目录。
# 2026-10-13 核对：演示主机仅监听 443，公网 80 入口重定向到 HTTPS。
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    # http2 on 需要 nginx >= 1.25.1；更旧版本请改用 listen 443 ssl http2;
    http2 on;
    server_name 122.51.105.107;

    ssl_certificate     /etc/letsencrypt/live/122.51.105.107/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/122.51.105.107/privkey.pem;

    root /opt/mall-demo/storefront;
    index index.html;
    client_max_body_size 10m;

    location = /admin { return 301 /admin/; }
    location /admin/ {
        alias /opt/mall-demo/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    location = /portal/mockPayment/confirm { return 404; }
    location ^~ /portal/alipay/ { return 404; }
    location ^~ /portal/swagger-ui/ { return 404; }
    location ^~ /portal/v3/api-docs { return 404; }
    location ^~ /portal/druid/ { return 404; }
    location ^~ /portal/actuator/ { return 404; }
    location /portal/ {
        proxy_pass http://127.0.0.1:8085/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /admin-api/admin/register { return 404; }
    location ^~ /admin-api/swagger-ui/ { return 404; }
    location ^~ /admin-api/v3/api-docs { return 404; }
    location ^~ /admin-api/druid/ { return 404; }
    location ^~ /admin-api/actuator/ { return 404; }
    location /admin-api/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / { try_files $uri $uri/ /index.html; }
}
