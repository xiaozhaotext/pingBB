# Place before the generic `location ^~ /sandbox/` block.
# Older UniApp builds resolve /oss images under their /sandbox/ base path.
# Redirect those requests to the existing /oss/ image proxy rather than
# serving the SPA index.html as image content.
location ^~ /sandbox/oss/ {
    rewrite ^/sandbox/oss/(.*)$ /oss/$1 redirect;
}
