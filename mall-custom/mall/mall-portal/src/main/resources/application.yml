spring:
  application:
    name: mall-portal
  profiles:
    active: dev #默认为开发环境
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

mybatis:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations:
    - classpath:dao/*.xml
    - classpath*:com/**/mapper/*.xml

mall:
  membership:
    payment:
      enabled: false
      wechat:
        enabled: false
        app-id: ${MEMBERSHIP_WECHAT_APP_ID:}
        merchant-id: ${MEMBERSHIP_WECHAT_MERCHANT_ID:}
        merchant-serial-number: ${MEMBERSHIP_WECHAT_MERCHANT_SERIAL:}
        private-key-path: ${MEMBERSHIP_WECHAT_PRIVATE_KEY_PATH:}
        api-v3-key: ${MEMBERSHIP_WECHAT_API_V3_KEY:}
        notify-url: ${MEMBERSHIP_WECHAT_NOTIFY_URL:}
      alipay:
        enabled: false
        app-id: ${MEMBERSHIP_ALIPAY_APP_ID:}
        seller-id: ${MEMBERSHIP_ALIPAY_SELLER_ID:}
        private-key-path: ${MEMBERSHIP_ALIPAY_PRIVATE_KEY_PATH:}
        public-key-path: ${MEMBERSHIP_ALIPAY_PUBLIC_KEY_PATH:}
        gateway-url: ${MEMBERSHIP_ALIPAY_GATEWAY_URL:}
        notify-url: ${MEMBERSHIP_ALIPAY_NOTIFY_URL:}
        return-url: ${MEMBERSHIP_ALIPAY_RETURN_URL:}
  payment:
    alipay:
      enabled: false # 未完成渠道验收与补偿闭环前禁止启用
    wechat:
      enabled: false # 未配置微信商户凭证并通过支付验收前禁止启用
      app-id: ${MALL_WECHAT_APP_ID:}
      merchant-id: ${MALL_WECHAT_MERCHANT_ID:}
      merchant-serial-number: ${MALL_WECHAT_MERCHANT_SERIAL:}
      private-key-path: ${MALL_WECHAT_PRIVATE_KEY_PATH:}
      api-v3-key: ${MALL_WECHAT_API_V3_KEY:}
      notify-url: ${MALL_WECHAT_NOTIFY_URL:}
      return-url: ${MALL_WECHAT_RETURN_URL:}
  sms:
    enabled: ${MALL_SMS_ENABLED:false} # 未配置短信服务商前保持关闭，验证码仅在接口返回（仅测试）
    provider: ${MALL_SMS_PROVIDER:ALIYUN} # ALIYUN 或 HTTP
    sign-name: ${MALL_SMS_SIGN_NAME:}
    template-code: ${MALL_SMS_TEMPLATE_CODE:}
    access-key-id: ${MALL_SMS_ACCESS_KEY_ID:}
    access-key-secret: ${MALL_SMS_ACCESS_KEY_SECRET:}
    region-id: ${MALL_SMS_REGION_ID:cn-hangzhou}
    endpoint: ${MALL_SMS_ENDPOINT:https://dysmsapi.aliyuncs.com}
    generic-url: ${MALL_SMS_GENERIC_URL:}
    generic-method: ${MALL_SMS_GENERIC_METHOD:GET}
    generic-params: ${MALL_SMS_GENERIC_PARAMS:}
    generic-success-keyword: ${MALL_SMS_GENERIC_SUCCESS_KEYWORD:}
    dev-return-code: ${MALL_SMS_DEV_RETURN_CODE:false} # 生产必须为 false；启用短信后默认不回显验证码
    timeout-millis: ${MALL_SMS_TIMEOUT_MILLIS:5000}
  p0:
    # Public reverse-proxy requests also appear to originate from loopback.
    # Keep consumer-created points, identity, earnings and contribution events disabled.
    # Only isolated local tests may override this property explicitly.
    consumer-simulation-enabled: false

jwt:
  tokenHeader: Authorization #JWT存储的请求头
  secret: mall-portal-secret #JWT加解密使用的密钥
  expiration: 604800 #JWT的超期限时间(60*60*24*7)
  tokenHead: 'Bearer '  #JWT负载中拿到开头

secure:
  ignored:
    urls: #安全路径白名单
      - /swagger-ui/
      - /v3/api-docs/*
      - /*/*.html
      - /*/*.js
      - /*/*.css
      - /*/*.png
      - /favicon.ico
      - /actuator/**
      - /druid/**
      - /sso/**
      - /home/**
      - /product/**
      - /brand/**
      - /alipay/notify
      - /member/recharge/notify/alipay
      - /member/recharge/notify/wechat
      - /member/membership/notify/alipay
      - /member/membership/notify/wechat
      - /wechatPay/notify

springdoc:
  swagger-ui:
    # 修改Swagger UI路径
    path: /swagger-ui.html
    # 开启Swagger UI界面
    enabled: true
    # 用于配置tag和operation的展开方式，这里配置为都不展开
    doc-expansion: 'none'
  api-docs:
    # 修改api-docs路径
    path: /v3/api-docs
    # 开启api-docs
    enabled: true
  group-configs:
    - group: 'mall-portal'
      packages-to-scan: com.macro.mall.portal.controller

# 自定义redis key
redis:
  database: mall
  key:
    authCode: 'ums:authCode'
    orderId: 'oms:orderId'
    member: 'ums:member'
  expire:
    authCode: 90 # 验证码超期时间
    common: 86400 # 24小时

# 消息队列定义
rabbitmq:
  queue:
    name:
      cancelOrder: cancelOrderQueue

# 普通订单支付宝渠道凭证（与后台退款共用 MALL_ALIPAY_* 环境变量）。
# 未配置凭证时 /alipay/* 由 mall.payment.alipay.enabled 开关保持关闭，返回 503。
alipay:
  gateway-url: ${MALL_ALIPAY_GATEWAY_URL:https://openapi.alipay.com/gateway.do}
  app-id: ${MALL_ALIPAY_APP_ID:}
  seller-id: ${MALL_ALIPAY_SELLER_ID:}
  app-private-key: ${MALL_ALIPAY_APP_PRIVATE_KEY:}
  alipay-public-key: ${MALL_ALIPAY_PUBLIC_KEY:}
  return-url: ${MALL_ALIPAY_RETURN_URL:}
  notify-url: ${MALL_ALIPAY_NOTIFY_URL:}
  format: JSON
  charset: UTF-8
  sign-type: RSA2
