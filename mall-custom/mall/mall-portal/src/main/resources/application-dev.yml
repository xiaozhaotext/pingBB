server:
  port: 8085

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/mall?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: root
    druid:
      initial-size: 5 #连接池初始化大小
      min-idle: 10 #最小空闲连接数
      max-active: 20 #最大连接数
      web-stat-filter:
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*" #不统计这些请求数据
      stat-view-servlet: #访问监控网页的登录用户名和密码
        login-username: druid
        login-password: druid
  data:
    mongodb:
      host: localhost
      port: 27017
      database: mall-port
    redis:
      host: localhost # Redis服务器地址
      database: 0 # Redis数据库索引（默认为0）
      port: 6379 # Redis服务器连接端口
      password: # Redis服务器连接密码（默认为空）
      timeout: 300ms # 连接超时时间（毫秒）
  rabbitmq:
    host: localhost
    port: 5672
    virtual-host: /mall
    username: mall
    password: mall

logging:
  level:
    root: info
    com.macro.mall: debug

logstash:
  host: localhost
  enableInnerLog: false

alipay:
  # The server currently uses the dev profile; explicit production merchant settings
  # must override these development defaults before real payments are enabled.
  gatewayUrl: ${MALL_ALIPAY_GATEWAY_URL:https://openapi.alipay.com/gateway.do}
  appId: ${MALL_ALIPAY_APP_ID:}
  sellerId: ${MALL_ALIPAY_SELLER_ID:}
  alipayPublicKey: ${MALL_ALIPAY_PUBLIC_KEY:}
  appPrivateKey: ${MALL_ALIPAY_APP_PRIVATE_KEY:}
  returnUrl: ${MALL_ALIPAY_RETURN_URL:}
  notifyUrl: ${MALL_ALIPAY_NOTIFY_URL:}

# 本地演示专用支付桩（仅 dev profile 生效，application-prod.yml 不放行）：
# 开启后 /mockPayment/** 可用，且仅允许 127.0.0.1 调用，
# 用于在没有真实支付宝/微信商户凭证时跑通「下单 -> 支付 -> 发货/退款」与会员权益购买全链路。
mall:
  payment:
    mock:
      enabled: true
  dividend:
    schedule:
      # 未配置时使用代码默认：每天 01:10 结算前一天
      cron: "0 10 1 * * ?"
      enabled: true
